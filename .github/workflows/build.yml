name: Build Fake Camera APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Không tìm thấy file ZIP"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Find Gradle project
        run: |
          echo "Các file trong project:"
          find project -maxdepth 3 -type f | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f "../gradlew" ]; then
            chmod +x ../gradlew
            ../gradlew assembleDebug
          else
            echo "ERROR: Không tìm thấy gradlew"
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Find APK
        run: |
          echo "APK đã build:"
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fake-Camera-APK
          path: |
            project/**/*.apk
